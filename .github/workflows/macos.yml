name: ghostfox-macos
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install llvm@19 rust cbindgen node
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"

      - name: Fetch Firefox 158 source
        run: |
          curl -L -o ff.tar.xz "https://archive.mozilla.org/pub/firefox/releases/158.0/source/firefox-158.0.source.tar.xz"
          tar xf ff.tar.xz
          mv firefox-158.0 tree

      - name: Overlay ghostfox sources
        run: |
          cp -r overlay/js/src/shell/. tree/js/src/shell/
          cp -r overlay/js/src/vm/.    tree/js/src/vm/
          cp -r overlay/config/.       tree/config/
          cat > tree/mozconfig <<EOF
          ac_add_options --enable-project=js
          ac_add_options --enable-js-shell
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          mk_add_options MOZ_MAKE_FLAGS="-j$(sysctl -n hw.ncpu)"
          EOF

      - name: Build js engine
        working-directory: tree
        run: |
          export PATH="$(brew --prefix llvm@19)/bin:$PATH"
          export CC="$(brew --prefix llvm@19)/bin/clang"
          export CXX="$(brew --prefix llvm@19)/bin/clang++"
          export CARGO_HOME="$HOME/.cargo"
          python3 mach build 2>&1 | tail -40

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: ghostfox-js-macos
          path: tree/obj-*/dist/bin/js
