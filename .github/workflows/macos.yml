name: ghostfox-macos
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    # FF158 pins macOS SDK >= 26.5; macos-26 image has Xcode 26.6 (SDK 26.6).
    # Linker: Apple ld from the selected Xcode, driven by Mozilla's clang —
    # the same pairing releng uses for native mac builds.
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # mach hard-caps supported python at 3.14; brew's default python3
          # on macos-26 is 3.15 and taskgraph deps (rtoml) won't build on it,
          # while python3.11 fallbacks fail taskgraph generation.
          brew install rust cbindgen node python@3.14
          mkdir -p /usr/local/bin
          ln -sf "$(brew --prefix python@3.14)/bin/python3.14" /usr/local/bin/python3
          ln -sf "$(brew --prefix python@3.14)/bin/python3.14" /usr/local/bin/python
          echo "$(brew --prefix python@3.14)/bin" >> "$GITHUB_PATH"
          hash -r
          python3 --version
          xcodebuild -version
          xcrun --show-sdk-version

      - name: SDK gate
        run: |
          SDK=$(xcrun --show-sdk-version)
          NEED=26.5
          if [ "$(printf '%s\n' "$NEED" "$SDK" | sort -V | head -1)" != "$NEED" ]; then
            echo "::error::macOS SDK $SDK is older than the required $NEED (FF158 pin). Select a newer Xcode."
            exit 1
          fi

      - name: Fetch Firefox 158 source
        run: |
          curl -L -o ff.tar.xz "https://archive.mozilla.org/pub/firefox/releases/158.0/source/firefox-158.0.source.tar.xz"
          tar xf ff.tar.xz
          mv firefox-158.0 tree

      - name: Overlay ghostfox sources
        run: |
          cp -r overlay/js/src/shell/. tree/js/src/shell/
          cp -r overlay/js/src/vm/.    tree/js/src/vm/
          cp -r overlay/config/.       tree/config/
          cat > tree/mozconfig <<EOF
          ac_add_options --enable-project=js
          ac_add_options --enable-js-shell
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-jemalloc
          # libc++ marks floating-point to_chars available(macos 13.3); the
          # engine's float from_chars sites are strtod-portable (macOS 26
          # would otherwise be required). 13.3 covers the fleet (15.6+ / 26).
          ac_add_options --enable-macos-target=13.3
          mk_add_options MOZ_MAKE_FLAGS="-j$(sysctl -n hw.ncpu)"
          EOF

      - name: Fetch Mozilla clang 19
        working-directory: tree
        run: |
          # python@3.14 is keg-only: its bin has no unversioned `python3`,
          # so PATH tricks can't select it — call the versioned interpreter
          # explicitly (mach caps supported python at 3.14; 3.15 breaks the
          # taskgraph deps, 3.11 breaks taskgraph generation).
          PY3="$(brew --prefix python@3.14)/bin/python3.14"
          "$PY3" --version
          "$PY3" mach artifact toolchain --from-build macosx64-aarch64-clang
          ls clang/bin/clang && clang/bin/clang --version

      - name: Build js engine
        working-directory: tree
        run: |
          # mach's state dir may hold virtualenvs built by an unsupported
          # python; start clean.
          rm -rf "$HOME/.mozbuild"
          export PATH="$PWD/clang/bin:$PATH"
          export CC="$PWD/clang/bin/clang"
          export CXX="$PWD/clang/bin/clang++"
          "$CC" --version
          PY3="$(brew --prefix python@3.14)/bin/python3.14"
          "$PY3" --version
          "$PY3" mach build

      - name: Build necko-worker beside engine (artifact ships js+worker)
        run: |
          command -v go >/dev/null || brew install -q go
          SHELL_DIR=$(dirname "$(ls tree/obj-*/dist/bin/js | head -1)")
          (cd go && go build -o "$SHELL_DIR/ghostfox-worker" ./cmd/necko-worker)

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: ghostfox-js-macos
          path: |
            tree/obj-*/dist/bin/js
            tree/obj-*/dist/bin/ghostfox-worker
          if-no-files-found: error

      - name: Smoke (engine runs, offline page)
        run: |
          command -v go >/dev/null || brew install -q go
          SHELL_BIN=$(ls tree/obj-*/dist/bin/js | head -1)
          SHELL_DIR=$(dirname "$SHELL_BIN")
          (cd go && go build -o "$SHELL_DIR/ghostfox-worker" ./cmd/necko-worker)
          (cd go && go build -o /tmp/ghostfox-smoke ./cmd/smoke)
          GHOSTFOX_SHELL="$SHELL_BIN" /tmp/ghostfox-smoke

      - name: Navtest (real Necko fetch via worker)
        continue-on-error: true
        run: |
          SHELL_BIN=$(ls tree/obj-*/dist/bin/js | head -1)
          (cd go && go build -o /tmp/ghostfox-navtest ./cmd/navtest)
          RUYIJS_SHELL="$SHELL_BIN" /tmp/ghostfox-navtest
