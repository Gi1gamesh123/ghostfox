name: ghostfox-linux
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install cbindgen

      - name: Fetch Firefox 158 source
        run: |
          curl -L -o ff.tar.xz "https://archive.mozilla.org/pub/firefox/releases/158.0/source/firefox-158.0.source.tar.xz"
          tar xf ff.tar.xz
          mv firefox-158.0 tree

      - name: Overlay ghostfox sources
        run: |
          cp -r overlay/js/src/shell/. tree/js/src/shell/
          cp -r overlay/js/src/vm/.    tree/js/src/vm/
          cp -r overlay/config/.       tree/config/
          cat > tree/mozconfig <<EOF
          ac_add_options --enable-project=js
          ac_add_options --enable-optimize=-O2
          ac_add_options --disable-jemalloc
          ac_add_options --disable-tests
          mk_add_options MOZ_PARALLEL_BUILD="$(nproc)"
          EOF

      - name: Fetch Mozilla clang 19
        working-directory: tree
        run: python3 mach artifact toolchain --from-build linux64-clang 2>&1 | tail -5

      - name: Build js engine
        working-directory: tree
        run: |
          export PATH="$PWD/clang/bin:$HOME/.cargo/bin:$PATH"
          export CC="$PWD/clang/bin/clang"
          export CXX="$PWD/clang/bin/clang++"
          "$CC" --version
          python3 mach build

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: ghostfox-js-linux
          path: tree/obj-*/dist/bin/js
          if-no-files-found: error

      - name: Smoke (engine runs, offline page)
        run: |
          command -v go >/dev/null || { sudo apt-get update && sudo apt-get install -y golang-go; }
          SHELL_BIN=$(ls tree/obj-*/dist/bin/js | head -1)
          SHELL_DIR=$(dirname "$SHELL_BIN")
          (cd go && go build -o "$SHELL_DIR/ghostfox-worker" ./cmd/necko-worker)
          (cd go && go build -o /tmp/ghostfox-smoke ./cmd/smoke)
          GHOSTFOX_SHELL="$SHELL_BIN" /tmp/ghostfox-smoke
